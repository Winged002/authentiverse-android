wireguardVersionCode=170
wireguardVersionName=1.7.0
wireguardPackageName=pro.digitalspace.android

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Turn off AP discovery in compile path to enable compile avoidance
kapt.include.compile.classpath=false

# Semicolon-separated SHA-256 pins for IDQA core roots. Empty = fail closed.
authentiverseIdqaRootSha256=
# HTTPS update manifest and semicolon-separated APK signer certificate SHA-256 pins. Empty = updater disabled.
authentiverseUpdateManifestUrl=
authentiverseUpdateSignerSha256=
